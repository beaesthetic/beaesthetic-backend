name: Tidy Go modules in Dependabot PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - "**/go.mod"
      - "**/go.sum"

permissions:
  contents: write

jobs:
  tidy:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Dependabot commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Tidy all Go modules
        run: |
          find . -name go.mod -not -path '*/vendor/*' -print0 |
            while IFS= read -r -d '' module; do
              directory="$(dirname "$module")"
              echo "Tidying $directory"
              (cd "$directory" && go mod tidy)
            done

      - name: Commit module changes
        run: |
          if git diff --quiet -- '**/go.mod' '**/go.sum'; then
            echo "All Go modules are tidy."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '**/go.mod' '**/go.sum'
          git commit -m "chore: tidy Go modules"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
