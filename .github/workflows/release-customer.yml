name: Build and Push Customer Service

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  TARGET_PLATFORMS: linux/arm64
  DOCKER_API_VERSION: 1.43
  REGISTRY: docker.io
  IMAGE_NAME: petretiandrea/customer-service-v2

jobs:
  build:
    #    runs-on: "gha-beaesthetic-scaler"
    runs-on: ubuntu-latest
    name: "Build and Push Docker image"
    # Only run if this is a manual dispatch OR if the release tag matches this service
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'customer-service-v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(jq -r '."customer"' .release-please-manifest.json)
          else
            TAG_NAME="${{ github.event.release.tag_name }}"
            if [[ "$TAG_NAME" =~ customer-service-v(.*) ]]; then
              VERSION="${BASH_REMATCH[1]}"
            else
              echo "Error: Tag name doesn't match expected pattern customer-service-v*"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: petretiandrea/customer-service-v2
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./customer
          file: ./customer/Dockerfile
          push: true
          platforms: ${{ env.TARGET_PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
