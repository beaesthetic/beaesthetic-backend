name: Code Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go-quality:
    runs-on: ubuntu-26.04-arm
    name: Go quality
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'

      - name: Check formatting and vet every Go module
        shell: bash
        run: |
          while IFS= read -r module; do
            directory="$(dirname "$module")"
            echo "Checking $directory"
            unformatted="$(find "$directory" -name '*.go' -not -path '*/vendor/*' -print0 | xargs -0 gofmt -l)"
            if [ -n "$unformatted" ]; then
              echo "Unformatted Go files:"
              echo "$unformatted"
              exit 1
            fi
            (cd "$directory" && go vet ./...)
          done < <(find . -name go.mod -not -path '*/vendor/*' | sort)

  helm-quality:
    runs-on: ubuntu-26.04-arm
    name: Helm quality
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint and render every chart
        shell: bash
        run: |
          while IFS= read -r chart; do
            chart_dir="$(dirname "$chart")"
            echo "Checking $chart_dir"
            helm lint "$chart_dir"
            helm template "$(basename "$(dirname "$chart_dir")")" "$chart_dir" >/dev/null
          done < <(find . -name Chart.yaml -not -path '*/charts/*' | sort)
