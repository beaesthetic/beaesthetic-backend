name: Main

on:
  push:
    branches:
      - main
    paths:
      - ".release-please-manifest.json"
      - ".github/workflows/main.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TARGET_PLATFORMS: linux/arm64
  REGISTRY: docker.io

jobs:
  changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      appointment: ${{ steps.release.outputs.appointment }}
      customer: ${{ steps.release.outputs.customer }}
      notification: ${{ steps.release.outputs.notification }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect released services
        id: release
        shell: bash
        run: |
          before="${{ github.event.before }}"
          manifest=".release-please-manifest.json"

          for service in appointment customer notification; do
            current="$(jq -r --arg service "$service" '.[$service] // empty' "$manifest")"
            previous=""
            if [ -n "$before" ] && git cat-file -e "$before:$manifest" 2>/dev/null; then
              previous="$(git show "$before:$manifest" | jq -r --arg service "$service" '.[$service] // empty')"
            fi

            if [ -n "$current" ] && [ "$current" != "$previous" ]; then
              echo "$service=true" >> "$GITHUB_OUTPUT"
              echo "$service released: $previous -> $current"
            else
              echo "$service=false" >> "$GITHUB_OUTPUT"
              echo "$service not released"
            fi
          done

  build:
    needs: changes
    runs-on: ubuntu-24.04-arm
    name: Build ${{ matrix.key }} prod image
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: appointment
            image: petretiandrea/appointment-service-v2
            context: ./appointment
            dockerfile: ./appointment/Dockerfile
          - key: customer
            image: petretiandrea/customer-service-v2
            context: ./customer
            dockerfile: ./customer/Dockerfile
          - key: notification
            image: petretiandrea/notification-service-v2
            context: ./notification
            dockerfile: ./notification/Dockerfile
            
    steps:
      - name: Checkout repository
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs[matrix.key] == 'true'
        uses: actions/checkout@v4

      - name: Extract release version
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs[matrix.key] == 'true'
        id: version
        shell: bash
        run: |
          VERSION=$(jq -r --arg service "${{ matrix.key }}" '.[$service]' .release-please-manifest.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Missing release version for ${{ matrix.key }}"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Extract Docker metadata
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs[matrix.key] == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Set up QEMU
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs[matrix.key] == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs[matrix.key] == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs[matrix.key] == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs[matrix.key] == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-contexts: |
            core-contracts=./core-contracts
          push: true
          platforms: ${{ env.TARGET_PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=main-${{ matrix.key }}
          cache-to: type=gha,mode=max,scope=main-${{ matrix.key }}
