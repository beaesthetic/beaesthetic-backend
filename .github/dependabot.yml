version: 2
updates:
  # Keep Go dependency PRs scoped to the module that owns them. This prevents a
  # change for one deployable service from being bundled with another service.
  - package-ecosystem: gomod
    directory: /appointment
    # Go version updates must never promote indirect requirements on their own.
    allow:
      - dependency-type: direct
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(appointment)"
    groups:
      major:
        update-types: [major]
      minor-and-patch:
        update-types: [minor, patch]
