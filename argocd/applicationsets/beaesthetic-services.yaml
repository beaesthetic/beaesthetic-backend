apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: beaesthetic-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    # Never delete prod Applications (and their resources) if an element is removed from the generator.
    applicationsSync: create-update
  generators:
    - list:
        elements:
          - service: appointment
            path: appointment/helm
          - service: customer
            path: customer/helm
          - service: notification
            path: notification/helm
          - service: identity
            path: identity-service/helm
  template:
    metadata:
      name: "{{.service}}-prod"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        app.kubernetes.io/part-of: beaesthetic
        beaesthetic.io/environment: prod
        beaesthetic.io/service: "{{.service}}"
      annotations:
        notifications.argoproj.io/subscribe.on-health-degraded.telegram: "-1004385477490" # beaesthetic monitoring channel
        notifications.argoproj.io/subscribe.on-sync-succeeded.telegram: "-1004385477490"
        notifications.argoproj.io/subscribe.on-sync-failed.telegram: "-1004385477490"
        notifications.argoproj.io/subscribe.on-deployed.telegram: "-1004385477490"
    spec:
      project: beaesthetic
      source:
        repoURL: https://github.com/beaesthetic/beaesthetic-backend.git
        targetRevision: HEAD
        path: "{{.path}}"
        helm:
          valueFiles:
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: beaesthetic
      syncPolicy:
        # Sync on git changes only: no prune, no selfHeal.
        automated: {}
        syncOptions:
          - CreateNamespace=true
