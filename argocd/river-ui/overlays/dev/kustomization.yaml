apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: beaesthetic-dev
resources:
  - ../../base
labels:
  - pairs:
      beaesthetic.io/environment: dev
patches:
  - target:
      kind: Ingress
      name: river-ui
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: river-ui-dev.internal.k8s
      - op: replace
        path: /spec/tls/0/hosts/0
        value: river-ui-dev.internal.k8s
      - op: replace
        path: /spec/tls/0/secretName
        value: river-ui-dev-tls
