environment: ''
namespace: beaesthetic
name: notification-service-v2
labels:
  app: notification-api-v2
replicaCount: 1
image:
  repository: petretiandrea/notification-service-v2
  tag: 2.9.1
  pullPolicy: IfNotPresent
service:
  create: true
  type: ClusterIP
  ports:
    - 8080
envConfig:
  APP__NAME: beaesthetic-notifications
  APP__ENV: prod
  HTTP__ADDR: ':8080'
  OTEL_SERVICE_NAME: notification-service
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_ENDPOINT: http://opentelemetry-collector.monitoring.svc.cluster.local:4318
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production,k8s.cluster.name=beaesthetic-k3s
  OTEL_METRICS_EXPORTER: otlp
  SMS_GATEWAY__URL: http://sms-gateway-api.beaesthetic.svc.cluster.local:80
  SMS_GATEWAY__FROM_NUMBER: '+393515253634'
  RABBITMQ__CUSTOMER_NOTIFICATION_OUTCOMES_ROUTING_KEY: customer.notifications.outcomes
  RABBITMQ__CUSTOMER_NOTIFICATION_QUEUE: customer.notifications
  CUSTOMER_SERVICE__URL: http://customer-service-v2.beaesthetic.svc.cluster.local:8080
  TEMPLATES__PATH: /app/templates
resources:
  requests:
    memory: 100Mi
    cpu: 80m
  limits:
    memory: 100Mi
    cpu: 80m
secretKeyRef:
  - name: POSTGRES__DSN
    secretRefName: notification-secrets
    key: postgres-dsn
  - name: RABBITMQ__URL
    secretRefName: notification-secrets
    key: rabbitmq-url
  - name: SMS_GATEWAY__API_KEY
    secretRefName: notification-secrets
    key: SMS_GATEWAY_API_KEY
initContainers:
  migrate:
    enabled: true
    command:
      - /app/notification
      - migrate
      - up
readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  failureThreshold: 10
  periodSeconds: 30
livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  failureThreshold: 10
  periodSeconds: 30
sidecar:
  outbox:
    image:
      repository: petretiandrea/outbox-forwarder
      tag: v1.6.0
      pullPolicy: IfNotPresent
    configMapRefs:
      - notification-service-v2-config
    secretKeyRef:
      - name: POSTGRES_DSN
        secretRefName: notification-secrets
        key: postgres-dsn
      - name: RABBITMQ_DSN
        secretRefName: notification-secrets
        key: rabbitmq-url
    volumeMounts:
      - name: outbox-config
        mountPath: /etc/outbox/outbox.yaml
        subPath: outbox.yaml
        readOnly: true
volumes:
  - name: outbox-config
    configMap:
      name: notification-service-v2-outbox-config
postgres:
  database: notifications
