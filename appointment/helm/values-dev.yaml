environment: dev
namespace: beaesthetic-dev
replicaCount: 1

envConfig:
  ENV_APP_NAME: appointment-service-v2
  ENV_REMOTE_CUSTOMER__URL: http://customer-service-v2:8080
  ENV_REMOTE_SCHEDULER__URL: http://scheduler-service:8080
  ENV_REMOTE_NOTIFICATION__URL: http://notification-service-v2:8080
  ENV_MONGO_DATABASE: appointments-v2-dev
  MONITOR_REMINDERS_FAILED_FREQUENCY: 30m

resources:
  requests:
    memory: 100Mi
    cpu: 50m
  limits:
    memory: 128Mi
    cpu: 100m

sidecar:
  outbox:
    configMapRefs:
      - appointment-service-v2-outbox-config

volumes:
  - name: outbox-config
    configMap:
      name: appointment-service-v2-outbox-config

