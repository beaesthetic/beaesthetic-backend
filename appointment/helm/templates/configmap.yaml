{{- if or .Values.envConfig -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Values.name }}-config"
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "appointment.commonLabels" . | nindent 4 }}
data:
  {{- if .Values.envConfig -}}
  {{- include "appointment.renderEnvConfig" . | nindent 2 }}
  {{- end }}
{{- end }}
---


