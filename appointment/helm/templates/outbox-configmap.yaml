apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Values.name }}-outbox-config"
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "appointment.commonLabels" . | nindent 4 }}
data:
  outbox.yaml: |-
    source:
      type: postgres
      data:
        dsn: ${POSTGRES_DSN}
        table_name: outbox_messages
        batch_size: 100
        poll_interval: 1s
        initialize_schema: true

    channels:
      - name: beaesthetic.appointments.internal.job
        publisher:
          type: rabbitmq
          data:
            url: ${RABBITMQ_DSN}
            exchange: beaesthetic.appointments
            routing_key: "appointments.internal.job"
            content_type: application/json
      - name: customer.notifications
        publisher:
          type: rabbitmq
          data:
            url: ${RABBITMQ_DSN}
            exchange: beaesthetic.notifications
            routing_key: "{{ .Values.envConfig.ENV_RABBITMQ_CUSTOMER__NOTIFICATION__QUEUE }}"
            content_type: application/json
