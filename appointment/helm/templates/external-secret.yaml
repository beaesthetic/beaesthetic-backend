apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: appointment-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "appointment.commonLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: oci-vault-backend
    kind: ClusterSecretStore
  refreshPolicy: CreatedOnce
  refreshInterval: 24h
  target:
    name: appointment-secrets-v2
    creationPolicy: Owner
    template:
      data:
        postgres-dsn: "postgres://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@postgres-rw.common.svc.cluster.local:5432/{{ include "appointment.databaseName" . }}?sslmode=disable"
        rabbitmq-url: "amqp://beaesthetic:{{ `{{ .rabbitmqPassword }}` }}@rabbitmq-v2.common.svc.cluster.local:5672/{{ include "appointment.environment" . }}"
  data:
    - secretKey: username
      remoteRef:
        key: beaesthetic-postgres
        property: username
    - secretKey: password
      remoteRef:
        key: beaesthetic-postgres
        property: password
    - secretKey: rabbitmqPassword
      remoteRef:
        key: rabbitmq-credentials
        property: password

