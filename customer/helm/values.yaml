namespace: "beaesthetic"
environment: ""
name: "customer-service-v2"
labels:
  app: "customer-api-v2"

replicaCount: 1

image:
  repository: petretiandrea/customer-service-v2
  pullPolicy: IfNotPresent

service:
  create: true
  type: ClusterIP
  ports:
    - 8080

envConfig:
  ENV_APP_NAME: "beaesthetic-customers"
  ENV_APP_ENV: "prod"
  ENV_HTTP_ADDR: ":8080"
  ENV_REDIS_CUSTOMERS__TTL: "1h"
  ENV_REDIS_CUSTOMERS__SEARCH__TTL: "5m"

secretKeyRef:
  - name: ENV_POSTGRES_DSN
    secretRefName: customer-secrets-v2
    key: postgres-dsn
  - name: ENV_REDIS_URI
    secretRefName: customer-secrets-v2
    key: redis-uri

initContainers:
  migrate:
    enabled: true

postgres:
  database: "customers"

resources:
  requests:
    memory: "100Mi"
    cpu: "80m"
  limits:
    memory: "128Mi"
    cpu: "120m"

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  failureThreshold: 10
  periodSeconds: 15

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  failureThreshold: 10
  periodSeconds: 30