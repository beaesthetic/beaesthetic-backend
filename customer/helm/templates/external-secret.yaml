apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: customer-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "customer.commonLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: oci-vault-backend
    kind: ClusterSecretStore
  refreshPolicy: Periodic
  refreshInterval: 24h
  target:
    name: customer-secrets-v2
    creationPolicy: Owner
    template:
      data:
        postgres-dsn: "postgres://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@postgres-rw.common.svc.cluster.local:5432/{{ include "customer.databaseName" . }}?sslmode=disable"
        redis-uri: "redis://:{{ `{{ .redisPassword }}` }}@redis-headless.common.svc.cluster.local:6379"
  data:
    - secretKey: username
      remoteRef:
        key: beaesthetic-postgres
        property: username
    - secretKey: password
      remoteRef:
        key: beaesthetic-postgres
        property: password
    - secretKey: redisPassword
      remoteRef:
        key: beaesthetic-redis