namespace: beaesthetic
name: identity-service
replicaCount: 1
image:
  repository: petretiandrea/identity-service
  tag: 0.2.0
  pullPolicy: IfNotPresent
service:
  port: 8080
env:
  ENV_HTTP_ADDR: ":8080"
  ENV_GRPC_ADDR: ":9090"
oidc:
  providers:
    - name: firebase
      issuer: https://securetoken.google.com/sms-gateway-b2986
      audience: sms-gateway-b2986
      discovery_url: http://firebase-discovery.beaesthetic.svc.cluster.local/.well-known/openid-configuration
initContainers:
  migrate:
    enabled: true
  seedRoles:
    enabled: true
  bootstrap:
    enabled: true
    path: /app/seeds/bootstrap.yaml
secretKeyRef:
  name: identity-secrets
resources:
  requests:
    cpu: 80m
    memory: 100Mi
  limits:
    cpu: 200m
    memory: 256Mi
