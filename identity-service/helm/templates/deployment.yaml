apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      {{- if and .Values.initContainers .Values.initContainers.migrate.enabled }}
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /app/identity
            - migrate
            - up
          envFrom:
            - secretRef:
                name: {{ .Values.secretKeyRef.name }}
          env:
            - name: ENV_HTTP_ADDR
              value: {{ .Values.env.ENV_HTTP_ADDR | quote }}
            - name: ENV_GRPC_ADDR
              value: {{ .Values.env.ENV_GRPC_ADDR | quote }}
        {{- if .Values.initContainers.seedRoles.enabled }}
        - name: seed-roles
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /app/identity
            - seed-roles
            - /app/seeds/roles.yaml
          envFrom:
            - secretRef:
                name: {{ .Values.secretKeyRef.name }}
          env:
            - name: ENV_HTTP_ADDR
              value: {{ .Values.env.ENV_HTTP_ADDR | quote }}
            - name: ENV_GRPC_ADDR
              value: {{ .Values.env.ENV_GRPC_ADDR | quote }}
        {{- if .Values.initContainers.bootstrap.enabled }}
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /app/identity
            - bootstrap
            - {{ .Values.initContainers.bootstrap.path | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretKeyRef.name }}
          env:
            - name: ENV_HTTP_ADDR
              value: {{ .Values.env.ENV_HTTP_ADDR | quote }}
            - name: ENV_GRPC_ADDR
              value: {{ .Values.env.ENV_GRPC_ADDR | quote }}
        {{- end }}
      {{- end }}
      {{- end }}
      containers:
        - name: identity
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
            - containerPort: 9090
          envFrom:
            - secretRef:
                name: {{ .Values.secretKeyRef.name }}
          env:
            - name: ENV_HTTP_ADDR
              value: {{ .Values.env.ENV_HTTP_ADDR | quote }}
            - name: ENV_GRPC_ADDR
              value: {{ .Values.env.ENV_GRPC_ADDR | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
